{{- if not .Values.secrets.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "muse.fullname" . }}
  labels:
    {{- include "muse.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secrets.DISCORD_TOKEN }}
  DISCORD_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.DISCORD_OAUTH_CLIENT_SECRET }}
  DISCORD_OAUTH_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.SENTRY_DNS }}
  SENTRY_DNS: {{ . | quote }}
  {{- end }}
  {{- $dbUrl := include "muse.databaseUrl" . }}
  {{- if $dbUrl }}
  DATABASE_URL: {{ $dbUrl | quote }}
  {{- end }}
{{- end }}
